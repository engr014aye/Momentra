name: momentra
description: Momentra – Build unbreakable routines with offline-first habit tracking.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.5
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0F1A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

